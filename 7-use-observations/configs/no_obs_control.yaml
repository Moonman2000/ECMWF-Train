# Control run for setup 2: the pretrained model, trained in the same way as encode_obs.yaml (same dates, steps
# and learning rate) but WITHOUT `obs`. Comparing the two shows what the observations add.
#
#   anemoi-training train --config-path=$PWD/configs --config-name=no_obs_control \
#       <dates of data, see configs/obs/era5_o96.yaml>
defaults:
- pretrain_o48
- _self_

system:
  input:
    graph: ${system.output.root}/graphs/no_obs_control.pt

# the same dates as `obs` in encode_obs.yaml: set them with
#   dataloader.training.datasets.data.start=... dataloader.training.datasets.data.end=... (and validation)
dataloader:
  batch_size:
    validation: 1
  limit_batches:
    validation: null
    test: null
  training:
    datasets:
      data:
        start: ???
        end: ???
  validation:
    datasets:
      data:
        start: ???
        end: ???
  test:
    datasets:
      data:
        start: ${dataloader.validation.datasets.data.start}
        end: ${dataloader.validation.datasets.data.end}

training:
  # Start from the checkpoint <system.output.root>/checkpoint/<fork_run_id>/last.ckpt of the pretrained run.
  fork_run_id: 4438386d8b894aa59beb57bb1c7e0b85 # the pretrained run (pretrain_o48)

  max_steps: 1000
  lr:
    rate: 1.0e-4
    warmup: 50
    iterations: ${training.max_steps}
    min: 3.0e-7

diagnostics:
  log:
    mlflow:
      run_name: no-obs-control
