# The pretrained model: the deterministic model of session 5 (../5-Anemoi-train/configs/deterministic_o48.yaml).
# Only ERA5 (dataset `data`, O48). The setups of this session start from a checkpoint of this config, so its
# model settings must not change, or the pretrained weights will not fit.
#
#   anemoi-training train --config-path=$PWD/configs --config-name=pretrain_o48
#
# Every file in the defaults lists is in configs/. The ones we do not change (e.g. model/graphtransformer.yaml)
# are copies of the defaults of anemoi-training 0.9.0, the version of this course.
defaults:
- data: toy
- dataloader: toy_o48
- diagnostics: evaluation
- system: course
- graph: pretrain_o48       # configs/graph/pretrain_o48.yaml
- model: graphtransformer
- training: default
- _self_

config_validation: True

data:
  resolution: o48

system:
  input:
    graph: ${system.output.root}/graphs/pretrain_o48.pt

# Smaller than the operational AIFS (1024 channels, 16 layers)
model:
  num_channels: 256
  processor:
    num_layers: 8

training:
  # input: the states at t-6h and t; output: the state at t+6h
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    max: 1

  max_steps: 2000
  max_epochs: null
  num_sanity_val_steps: 1

  # One GPU, so this is also the effective learning rate.
  lr:
    rate: 5.0e-4
    warmup: 100
    iterations: ${training.max_steps}
    min: 3.0e-7

  scalers:
    datasets:
      data:
        general_variable:
          weights:
            default: 1
            t: 3
            z: 3
            tp: 0.025
            cp: 0.0025

  variable_groups:
    datasets:
      data:
        default: sfc
        pl:
          param: [t, z]

  metrics:
    datasets:
      data: [z_500, t_850, 2t]

diagnostics:
  plot:
    callbacks: [] # we make our own plots in the notebook
  checkpoint:
    every_n_epochs:
      save_frequency: 1
      num_models_saved: 1
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
  log:
    interval: 10
    mlflow:
      enabled: True
      offline: True # log to files in system.output.root/logs/mlflow, no server needed
      tracking_uri: ${system.output.logs.mlflow}
      experiment_name: training-course-obs
      run_name: pretrain-o48
