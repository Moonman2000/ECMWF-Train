# The deterministic model of session 5 (../5-Anemoi-train/configs/deterministic_o48.yaml), the model we
# fine-tune with observations. The model settings must stay the same as in session 5, so that the weights
# of a session-5 checkpoint fit.
#
# Files that are not in configs/ (e.g. model/graphtransformer.yaml) come from the installed anemoi-training
# package: they are the same as in ../5-Anemoi-train/configs.
defaults:
- data: toy
- dataloader: toy_o48
- diagnostics: evaluation
- system: course
- graph: multi_scale
- model: graphtransformer
- training: default
- _self_

config_validation: True

data:
  resolution: o48

system:
  input:
    graph: ${system.output.root}/graphs/deterministic_o48.pt

# The O48 grid has 10,944 points. A refined icosahedron of resolution 4 gives 2,562 hidden nodes.
graph:
  nodes:
    hidden:
      node_builder:
        resolution: 4

# Smaller than the operational AIFS (1024 channels, 16 layers)
model:
  num_channels: 256
  processor:
    num_layers: 8

training:
  multistep_input: 2
  rollout:
    start: 1
    epoch_increment: 0
    max: 1

  max_steps: 1000
  max_epochs: null
  num_sanity_val_steps: 1

  lr:
    rate: 5.0e-4
    warmup: 100
    iterations: ${training.max_steps}
    min: 3.0e-7

  scalers:
    datasets:
      data:
        general_variable:
          weights:
            default: 1
            t: 3
            z: 3
            tp: 0.025
            cp: 0.0025

  variable_groups:
    datasets:
      data:
        default: sfc
        pl:
          param: [t, z]

  metrics:
    datasets:
      data: [z_500, t_850, 2t]

diagnostics:
  plot:
    callbacks: [] # we make our own plots in the notebook
  checkpoint:
    every_n_epochs:
      save_frequency: 1
      num_models_saved: 1
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
  log:
    interval: 10
    mlflow:
      enabled: True
      offline: True # log to files in system.output.root/logs/mlflow, no server needed
      tracking_uri: ${system.output.logs.mlflow}
      experiment_name: training-course-obs
      run_name: deterministic-o48
