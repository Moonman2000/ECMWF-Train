# The dataloader of session 5 (../5-Anemoi-train/configs/dataloader/toy_o48.yaml), for anemoi-core `main`:
# the arguments of open_dataset now go under `dataset_config`.
# Train on 2010-2020, validate on 2021, test on 2022. The setups with observations replace these periods
# (see configs/obs/era5_o96.yaml).
defaults:
  - native_grid  # the default of anemoi-training, the rest of this file overrides it
  - _self_

num_workers:
  training: 4
  validation: 4
  test: 4
batch_size:
  training: 2
  validation: 2
  test: 2

# Use only N batches per epoch (null = all of them): validate and checkpoint every 100 steps.
limit_batches:
  training: 100
  validation: 8
  test: 8

training:
  datasets:
    data:
      start: null
      end: 2020

validation:
  datasets:
    data:
      start: 2021
      end: 2021

test:
  datasets:
    data:
      start: 2022
      end: null
