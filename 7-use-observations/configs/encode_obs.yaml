# Setup 2: ENCODE the observations: they become an extra input of the forecast (towards data assimilation).
#
#   data (O48 ERA5, t-6h, t) --encoder.data--\                                /--decoder.data--> data (t+6h)
#                                            (+)--> hidden --processor--> hidden
#   obs (t-6h, t)            --encoder.obs---/                                \--decoder.obs---> obs  (t+6h, loss weight 0)
#
# The observed variables are prognostic now: input (t-6h, t) and output (t+6h). In anemoi-training 0.9 every
# dataset is also decoded and has a loss, so to use `obs` ONLY as an input we give its loss a weight of 0
# (training.scalers.datasets.obs.general_variable.weights.default). Set it to 1 to also learn to predict `obs`.
#
# The obs encoder and decoder start from random weights. Nothing is frozen: the whole model is fine-tuned, with
# a smaller learning rate.
#
#   anemoi-training train --config-path=$PWD/configs --config-name=encode_obs \
#       system.input.pretrained_run_id=<run id of pretrain_o48> <obs dates, see configs/obs/era5_o96.yaml>
defaults:
- pretrain_o48
- obs: era5_o96
- override graph: encode_obs  # configs/graph/encode_obs.yaml
- _self_

data:
  datasets:
    obs:
      diagnostic: [] # the observed variables are prognostic: input and output

system:
  input:
    graph: ${system.output.root}/graphs/encode_obs.pt
    # run id of the pretrained run (pretrain_o48): its checkpoint <system.output.root>/checkpoint/<run id>/last.ckpt is the start
    pretrained_run_id: ???

training:
  scalers:
    datasets:
      obs:
        general_variable:
          weights:
            default: 0 # `obs` only as input: no loss on it

  max_steps: 1000
  lr:
    rate: 1.0e-4 # lower than for pretraining: the pretrained part of the model is trained too
    warmup: 50
    iterations: ${training.max_steps}
    min: 3.0e-7

diagnostics:
  # Start from the pretrained weights: every weight of the pretrained checkpoint that exists in this model with
  # the same name and shape is loaded; the rest is new (see pretrained_weights.py). training.fork_run_id would
  # resume the pretrained run instead, which fails with a new dataset in anemoi-training 0.9.
  callbacks:
  - _target_: pretrained_weights.LoadPretrainedWeights
    checkpoint: ${system.output.root}/${system.output.checkpoints.root}/${system.input.pretrained_run_id}/last.ckpt
  log:
    mlflow:
      run_name: encode-obs
