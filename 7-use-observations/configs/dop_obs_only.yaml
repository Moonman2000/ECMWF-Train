# Experiment 3: an OBSERVATION-ONLY model (in the spirit of AIFS-DOP / GraphDOP): no ERA5 at all.
#
#   obs (observations at t-6h, t) --encoder--> hidden --processor--> hidden --decoder--> obs (t+6h)
#
# It is the model of session 5, trained from scratch on the observation dataset instead of ERA5. The dataset
# is called `data` (like the ERA5 dataset of session 5), so all other settings stay as they are.
# The prediction is made at every point of the obs grid, also where there is no observation.
#
#   anemoi-training train --config-path=$PWD/configs --config-name=dop_obs_only
defaults:
- deterministic_o48
- override data: obs_only
- _self_

# our own imputer (obs_imputer.ObsImputer) is not in the config schema of anemoi-training
config_validation: False

data:
  resolution: o96

system:
  input:
    graph: ${system.output.root}/graphs/dop_obs_only.pt

dataloader:
  # the observation zarr, with the observed variables and the forcings
  dataset:
    dataset: ${system.input.obs_dataset}
    select: [cos_latitude, cos_longitude, sin_latitude, sin_longitude, cos_julian_day, cos_local_time,
             sin_julian_day, sin_local_time, insolation, lsm, z, t_850, t_500, z_500, u_500, v_500, q_700]

training:
  max_steps: 2000
  training_loss:
    datasets:
      data:
        # nan_mask_weights: the gaps of the target (filled in by the imputer) get a weight of 0
        scalers: ['pressure_level', 'general_variable', 'node_weights', 'nan_mask_weights']
  variable_groups:
    datasets:
      data:
        default: sfc
        pl:
          param: [t, z, u, v, q]
  metrics:
    datasets:
      data: [t_850, z_500, u_500]

diagnostics:
  log:
    mlflow:
      run_name: dop-obs-only
