# Graph of the pretrained model (configs/pretrain_o48.yaml): one graph, for `data` (ERA5 O48, 10,944 nodes).
#
#   data --encoder--> hidden (2,562 nodes) --processor--> hidden --decoder--> data
#
# In anemoi-training 0.9 the graph config is applied to EACH dataset: anemoi builds one graph per dataset, with the
# grid points of that dataset as the `data` nodes, and saves it as <system.input.graph>_<dataset name>.pt.
# All datasets share the hidden nodes and the processor edges; each has its own encoder and decoder edges.
#
# Must stay the same as the graph the pretrained checkpoint was trained with.
overwrite: True

# names of the data nodes and of the hidden nodes in the graph
data: "data"
hidden: "hidden"

nodes:
  # the grid points of the dataset the graph is built for
  data:
    node_builder:
      _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
      dataset: "PLACEHOLDER_DATASET_WILL_BE_OVERRIDDEN"  # always set from dataloader.training.datasets.<name>.dataset
    attributes: ${graph.attributes.nodes}
  # a refined icosahedron of resolution 4: 2,562 nodes. The same for all datasets: they share the processor.
  hidden:
    node_builder:
      _target_: anemoi.graphs.nodes.TriNodes
      resolution: 4

edges:
# encoder: data -> hidden
- source_name: ${graph.data}
  target_name: ${graph.hidden}
  edge_builders:
  - _target_: anemoi.graphs.edges.CutOffEdges
    cutoff_factor: 0.6
    source_mask_attr_name: null
    target_mask_attr_name: null
  attributes: ${graph.attributes.edges}
# processor: hidden -> hidden
- source_name: ${graph.hidden}
  target_name: ${graph.hidden}
  edge_builders:
  - _target_: anemoi.graphs.edges.MultiScaleEdges
    x_hops: 1
    scale_resolutions: ${graph.nodes.hidden.node_builder.resolution}
    source_mask_attr_name: null
    target_mask_attr_name: null
  attributes: ${graph.attributes.edges}
# decoder: hidden -> data. Each data node receives from its 3 nearest hidden nodes.
- source_name: ${graph.hidden}
  target_name: ${graph.data}
  edge_builders:
  - _target_: anemoi.graphs.edges.KNNEdges
    num_nearest_neighbours: 3
    source_mask_attr_name: null
    target_mask_attr_name: null
  attributes: ${graph.attributes.edges}

attributes:
  nodes:
    area_weight:
      _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
      norm: unit-max
      fill_value: 0
  edges:
    edge_length:
      _target_: anemoi.graphs.edges.attributes.EdgeLength
      norm: unit-std
    edge_dirs:
      _target_: anemoi.graphs.edges.attributes.EdgeDirection
      norm: unit-std

post_processors: []
