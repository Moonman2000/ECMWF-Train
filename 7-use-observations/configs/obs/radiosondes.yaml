# @package _global_
#
# The gridded observation dataset, added as a second dataset called `obs`.
#
# Test dataset: radiosonde observations of the AIFS-DOP training data, gathered ("binned") onto the
# O96 grid every 6 hours. A grid point that had no sounding in the 6-hour window is NaN, so ~99% of
# the values of every observed variable are NaN. The forcings (coordinates, time, lsm, orography)
# are defined everywhere.
#
# To use another gridded observation dataset, copy this file, change the path in
# system.input.obs_dataset and the variable lists below, and select it in the experiment config with
# `obs: <new file name>`. Requirements (gridded datasets only):
#   - same frequency as the ERA5 dataset (6h)
#   - the same dates in each period: samples are matched by position, not by date
#   - statistics (mean, stdev, ...) of every variable in the dataset
#   - NaN where there is no observation (filled in by the imputer, see obs_imputer.py)
#   - the variables that are not observed (coordinates, time, ...) without NaNs
#
# In this version of anemoi, EVERY dataset has its own encoder and decoder (the same kind as for ERA5)
# and its own loss. So `obs` needs the same sections as `data`: data, dataloader, grid_indices and the
# training sections (loss, scalers, metrics).

data:
  datasets:
    obs:
      # By default the observed variables are *diagnostic*: the model predicts them, but they are not
      # an input (this is the "decode to observations" setup). The forcings are the input of the obs encoder.
      diagnostic: [t_850, t_500, z_500, u_500, v_500, q_700]
      forcing:
        - "cos_latitude"
        - "cos_longitude"
        - "sin_latitude"
        - "sin_longitude"
        - "cos_julian_day"
        - "cos_local_time"
        - "sin_julian_day"
        - "sin_local_time"
        - "insolation"
        - "lsm"
        - "z"
      processors:
        # A dataset must not contain NaNs after its processors. The imputer fills the gaps with the mean of
        # each observed variable and tells the loss where they were (see obs_imputer.py).
        # It comes first: it fills in the mean in physical units, before normalisation.
        imputer:
          _target_: obs_imputer.ObsImputer
          config:
            default: "none"
            mean: [t_850, t_500, z_500, u_500, v_500, q_700]
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: "mean-std" # with the statistics of the observations (ignoring NaNs)
            std:
            min-max:
            max:
              - "z"
            none:
              - "cos_latitude"
              - "cos_longitude"
              - "sin_latitude"
              - "sin_longitude"
              - "cos_julian_day"
              - "cos_local_time"
              - "sin_julian_day"
              - "sin_local_time"
              - "insolation"
              - "lsm"

# Which variables of the zarr to read (the observed ones and the forcings), in the same periods as `data`.
# `dataset` takes anything anemoi-datasets' open_dataset accepts.
dataloader:
  grid_indices:
    datasets:
      obs:
        _target_: anemoi.training.data.grid_indices.FullGrid
        nodes_name: ${graph.data}
  training:
    datasets:
      obs:
        dataset:
          dataset: ${system.input.obs_dataset}
          select: [cos_latitude, cos_longitude, sin_latitude, sin_longitude, cos_julian_day, cos_local_time,
                   sin_julian_day, sin_local_time, insolation, lsm, z, t_850, t_500, z_500, u_500, v_500, q_700]
        start: ${dataloader.training.datasets.data.start}
        end: ${dataloader.training.datasets.data.end}
        frequency: ${data.frequency}
        drop: []
        trajectory: null
  validation:
    datasets:
      obs:
        dataset: ${dataloader.training.datasets.obs.dataset}
        start: ${dataloader.validation.datasets.data.start}
        end: ${dataloader.validation.datasets.data.end}
        frequency: ${data.frequency}
        drop: []
        trajectory: null
  test:
    datasets:
      obs:
        dataset: ${dataloader.training.datasets.obs.dataset}
        start: ${dataloader.test.datasets.data.start}
        end: ${dataloader.test.datasets.data.end}
        frequency: ${data.frequency}
        drop: []
        trajectory: null

training:
  training_loss:
    datasets:
      obs:
        _target_: anemoi.training.losses.MSELoss
        # ~99% of the targets are gaps (no observation there), filled in by the imputer:
        # nan_mask_weights gives them a weight of 0 in the loss
        scalers: ["general_variable", "node_weights", "nan_mask_weights"]
        ignore_nans: False

  scalers:
    datasets:
      obs:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_name: ${graph.data}
          nodes_attribute_name: area_weight
          norm: unit-sum
        nan_mask_weights:
          _target_: anemoi.training.losses.scalers.NaNMaskScaler

  validation_metrics:
    datasets:
      obs:
        mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: ["node_weights"]
          ignore_nans: True # the gaps are NaN again after the model (see obs_imputer.py)

  variable_groups:
    datasets:
      obs:
        default: sfc
        pl:
          param: [t, z, u, v, q]

  metrics:
    datasets:
      obs: [t_850, z_500, u_500]
