# Setup 1: fine-tune the pretrained model with a NEW DECODER that predicts the observations.
#
#   data (O48 ERA5, t-6h, t) --encoder.data--\                                /--decoder.data--> data (t+6h)
#                                            (+)--> hidden --processor--> hidden
#   obs forcings (t-6h, t)   --encoder.obs---/                                \--decoder.obs---> obs  (t+6h)
#
# The observed variables are only a target (diagnostic). In anemoi-training 0.9 every dataset is also encoded,
# so the obs encoder reads what `obs` has as input: its forcings (position, time of day, insolation, land-sea
# mask, orography). Its latent state is added to the one of ERA5 on the hidden mesh.
#
# Everything pretrained is loaded from the checkpoint and frozen: only the obs encoder and decoder (random
# weights at the start) are trained. They are trained on the dates that both datasets have
# (configs/obs/era5_o96.yaml): the pretrained model needs ERA5 O48 as input, the obs decoder `obs` as target.
#
#   anemoi-training train --config-path=$PWD/configs --config-name=finetune_obs_decoder \
#       system.input.pretrained_run_id=<run id of pretrain_o48> <obs dates, see configs/obs/era5_o96.yaml>
defaults:
- pretrain_o48       # everything of the pretrained model ...
- obs: era5_o96      # ... plus the dataset `obs`
- override graph: finetune_obs_decoder  # configs/graph/finetune_obs_decoder.yaml
- _self_

system:
  input:
    graph: ${system.output.root}/graphs/finetune_obs_decoder.pt
    # run id of the pretrained run (pretrain_o48): its checkpoint <system.output.root>/checkpoint/<run id>/last.ckpt is the start
    pretrained_run_id: ???

training:
  # Freeze by module name: every module called "data" (encoder.data, decoder.data, their graph edges and
  # trainable node parameters), the processor and its trainable edge parameters. [] fine-tunes the whole model.
  submodules_to_freeze: [encoder.data, processor, decoder.data]

  max_steps: 1000
  lr:
    rate: 1.0e-3
    warmup: 50
    iterations: ${training.max_steps}
    min: 3.0e-7

diagnostics:
  # Start from the pretrained weights: every weight of the pretrained checkpoint that exists in this model with
  # the same name and shape is loaded; the rest is new (see pretrained_weights.py). training.fork_run_id would
  # resume the pretrained run instead, which fails with a new dataset in anemoi-training 0.9.
  callbacks:
  - _target_: pretrained_weights.LoadPretrainedWeights
    checkpoint: ${system.output.root}/${system.output.checkpoints.root}/${system.input.pretrained_run_id}/last.ckpt
  log:
    mlflow:
      run_name: finetune-obs-decoder
